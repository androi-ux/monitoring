name: ispace monitor

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes (GitHub's practical minimum under load)
  workflow_dispatch: # lets you trigger it manually from the Actions tab

permissions:
  contents: write # needed so the workflow can commit snapshot.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_URLS: "https://ispace.ge/en/category/ipad,https://ispace.ge/en/category/open-box"
          SEND_IMAGES: "1"

      - name: Commit updated snapshot
        run: |
          git config user.name "ispace-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshot.json
          git diff --staged --quiet || git commit -m "Update snapshot [skip ci]"
          git push

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="ispace monitor: workflow run failed. ${RUN_URL}"
